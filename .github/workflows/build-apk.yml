name: Build signed APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Detekt
        run: ./gradlew :app:detekt

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
          if-no-files-found: ignore

  build:
    name: Signed APK
    needs: check
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
            export SIGNING_STORE_PASSWORD="$STORE_PASSWORD"
            export SIGNING_KEY_ALIAS="$KEY_ALIAS"
            export SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
          else
            echo "::warning::No signing secrets; APK will be unsigned"
          fi
          ./gradlew :app:assembleRelease

      - name: Verify signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app/build/outputs/apk/release/launcher.apk
          if-no-files-found: error
