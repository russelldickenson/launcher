[versions]
#jetbrains
kotlin = "2.3.10"
#KSP
ksp = "2.3.10"
#Detekt
#detekt
detekt = "1.23.8"
detektCompose = "0.4.28"
#Material
material = "1.13.0"
#Room
room = "2.8.4"
#AndroidX
coreKtx = "1.17.0"
appcompat = "1.7.1"
#Image loading
glide = "5.0.5"
#Other
fastScroller = "5a95285b1f"
immutableCollections = "0.4.0"
#Gradle
gradlePlugins-agp = "9.2.1"
#build
app-build-compileSDKVersion = "36"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"
[libraries]
#Material
material = { module = "com.google.android.material:material", version.ref = "material" }
#Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
#Compose
compose-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
#AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
#Image loading
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
#Other
recyclerview-fast-scroller = { module = "com.github.tibbi:RecyclerView-FastScroller", version.ref = "fastScroller" }
kotlin-immutable-collections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "immutableCollections" }
[bundles]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
]
[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
